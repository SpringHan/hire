[package]
name = "hire"
version = "0.3.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Core Basic deps
ratatui = "0.30"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }  # no libchafa
ansi-to-tui = "8"
chrono = { version = "0.4.31", features = ["alloc", "std"] }
clap = { version = "~4.5", features = ["derive"]}
thiserror = "~2.0"
anyhow = "~1.0"
lazy_static = "1"
libc = "0.2"

# Extensions
file-size = "1.0.3"
copy_dir = "0.1.3"
is_executable = "1.0.1"
toml_edit = "0.25.17"
image = "0.25.5"

# Shell sessions
portable-pty = "0.9"
# 0.16 is the first line with a working scrollback (offset > rows no longer
# underflows); it needs unicode-width 0.2.1+, which is why ratatui is 0.30.
vt100 = "0.16"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
strip = true
